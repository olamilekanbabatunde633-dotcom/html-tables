<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Tables are to arrange data in row ansd columns
     Column - vertical
     Row - horizontal
     th - table head
     tr - table row
     td - table data -->
     <table border="1">
        <th>Day</th>
        <th>Breakfast</th>
        <th>Lunch</th>
        <th>Dinner</th>

        <tr>
            <td>Monday</td>
            <td>bread and pap</td>
            <td>Garri and groundnut</td>
            <td>Noodles</td>
        </tr>

        <tr>
            <td>Tuesday</td>
            <td>spag & smoked fish</td>
            <td>garri and coconut</td>
            <td>water and air</td>
        </tr>
        
       <tr>
         <td>Wednesday</td>
        <td>pap and groundnut</td>
        <td>garri and butter</td>
        <td>water and air</td>
       </tr>
     </table>
   
</body>
</html>
