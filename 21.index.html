<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Tables are to arrange data in row ansd columns
     Column - vertical
     Row - horizontal
     th - table head
     tr - table row
     td - table data -->
     <table>
        <th>S/N</th>
        <th>Name</th>
        <th>Account balance</th>
        <th>Universities</th>

        <tr>
            <td>1</td>
            <td>David</td>
            <td>110,000000</td>
            <td>Bowen</td>
        </tr>

        <tr>
            <td>2</td>
            <td>seun</td>
            <td>200,00000</td>
            <td>Lautech</td>
        </tr>
     </table>
</body>
</html>
